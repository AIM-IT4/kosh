name: Validate Android editions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release verification regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Unit tests
        run: ./gradlew test --console=plain
      - name: Build both editions and device tests
        run: >-
          ./gradlew :app:assembleStandardDebug :app:assembleOfflineDebug
          :app:assembleStandardDebugAndroidTest :app:assembleOfflineDebugAndroidTest --console=plain
      - name: Inspect offline APK permissions
        run: python3 scripts/release_checks.py offline app/build/outputs/apk/offline/debug/app-offline-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kosh-debug-apks
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/
            core/*/build/test-results/
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedStandardDebugAndroidTest :app:connectedOfflineDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
