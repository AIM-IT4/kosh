name: Release candidate

# Builds immutable candidates for device testing. This workflow never publishes a release.
on:
  push:
    branches: [main]
    paths: ["app/build.gradle.kts", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  candidate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the existing release key
        env:
          KOSH_KEYSTORE_BASE64: ${{ secrets.KOSH_KEYSTORE_BASE64 }}
        run: |
          test -n "$KOSH_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KOSH_KEYSTORE_BASE64" | base64 -d > keystore/kosh-release.jks
      - name: Build signed release APKs without cached outputs
        env:
          ORG_GRADLE_PROJECT_KOSH_STORE_PASSWORD: ${{ secrets.KOSH_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KOSH_KEY_PASSWORD: ${{ secrets.KOSH_KEY_PASSWORD }}
        run: |
          test -n "$ORG_GRADLE_PROJECT_KOSH_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_KOSH_KEY_PASSWORD"
          ./gradlew clean :app:assembleStandardRelease :app:assembleOfflineRelease --console=plain --no-build-cache
      - name: Verify and identify the candidate
        run: |
          mkdir candidate
          cp app/build/outputs/apk/standard/release/app-standard-release.apk candidate/Kosh.apk
          cp app/build/outputs/apk/offline/release/app-offline-release.apk candidate/Kosh-offline.apk
          python3 scripts/release_checks.py apks candidate --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --write
          CODE=$(python3 -c 'import json; print(json.load(open("candidate/candidate.json"))["version_code"])')
          cp "fastlane/metadata/android/en-US/changelogs/$CODE.txt" candidate/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: kosh-release-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Remove the keystore
        if: always()
        run: rm -f keystore/kosh-release.jks
