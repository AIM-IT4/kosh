name: Release

# Builds both editions signed with the Kosh release key and publishes them as a GitHub release.
# Runs when a version tag is pushed: `git tag v2.0.1 && git push origin v2.0.1`.
# Needs three repository secrets: KOSH_KEYSTORE_BASE64 (`base64 -w0 keystore/kosh-release.jks`),
# KOSH_STORE_PASSWORD and KOSH_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Restore the release keystore
        env:
          KOSH_KEYSTORE_BASE64: ${{ secrets.KOSH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KOSH_KEYSTORE_BASE64" ]; then
            echo "The KOSH_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          mkdir -p keystore
          echo "$KOSH_KEYSTORE_BASE64" | base64 -d > keystore/kosh-release.jks
      - name: Build both editions (release-signed)
        env:
          KOSH_STORE_PASSWORD: ${{ secrets.KOSH_STORE_PASSWORD }}
          KOSH_KEY_PASSWORD: ${{ secrets.KOSH_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleStandardRelease :app:assembleOfflineRelease --console=plain \
            -PKOSH_STORE_PASSWORD="$KOSH_STORE_PASSWORD" -PKOSH_KEY_PASSWORD="$KOSH_KEY_PASSWORD"
      - name: Check signatures and that the offline edition has no INTERNET permission
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/standard/release/app-standard-release.apk Kosh.apk
          cp app/build/outputs/apk/offline/release/app-offline-release.apk Kosh-offline.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs Kosh.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs Kosh-offline.apk
          if "$BUILD_TOOLS/aapt2" dump permissions Kosh-offline.apk | grep -q "android.permission.INTERNET"; then
            echo "Offline edition must not request INTERNET"; exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Kosh $VERSION"
            cat "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" 2>/dev/null
            echo "Tip: make a backup (More > Backup) before updating."
          } > notes.txt
          gh release create "$GITHUB_REF_NAME" Kosh.apk Kosh-offline.apk --title "Kosh $VERSION" --notes-file notes.txt
      - name: Remove the keystore
        if: always()
        run: rm -f keystore/kosh-release.jks
